[project]
name = "kiatracker"
version = "0.1.0"
description = "Personal Kia EV3 tracker: collects vehicle data from the official EU Data Act API and models drives, charging and consumption"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dashboard = [
    "altair>=5",
    "pandas>=2.2",
    "streamlit>=1.40",
]

[project.scripts]
kiatracker = "kiatracker.cli:main"

[dependency-groups]
dev = [
    "kiatracker[dashboard]",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["spikes"]  # throwaway API probes, not maintained code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
