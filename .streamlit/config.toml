# Committed on purpose: no secrets here. Streamlit secrets would go in secrets.toml, which is gitignored.
[browser]
gatherUsageStats = false  # don't send usage statistics to Streamlit

[server]
headless = true
enableStaticServing = true  # fonts and logo from src/kiatracker/dashboard/static, no third-party requests

[client]
toolbarMode = "viewer"  # hide developer options such as Deploy
showErrorDetails = "none"  # no stack traces or file paths in the browser

# Windrose "Morning" identity: one light theme. Colours mirror src/kiatracker/dashboard/theme.py.
[theme]
base = "light"
font = "Hanken Grotesk"
headingFont = "Young Serif"
headingFontWeights = [400, 400, 400, 400, 400, 400]
primaryColor = "#1D2B3A"
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#EDF2F7"
textColor = "#1D2B3A"
borderColor = "#E2E8EF"
baseRadius = "14px"
metricValueFontSize = "1.8rem"
metricValueFontWeight = 400
showSidebarBorder = false
chartCategoricalColors = ["#DC756D", "#4A90C2", "#C8D8E8", "#F2C14E", "#2F6E9A", "#B4463E"]

[[theme.fontFaces]]
family = "Young Serif"
url = "app/static/young-serif.woff2"
weight = 400

[[theme.fontFaces]]
family = "Hanken Grotesk"
url = "app/static/hanken-grotesk-var.woff2"
weight = "100 900"
