<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Windrose</title>
  <!-- short points: NE, SE, SW, NW -->
  <g fill="#86b6ef">
    <polygon points="32,32 46,18 36,32"/>
    <polygon points="32,32 46,46 32,36"/>
    <polygon points="32,32 18,46 28,32"/>
    <polygon points="32,32 18,18 32,28"/>
  </g>
  <!-- long points: N, E, S, W; each split light/dark like a compass star -->
  <polygon points="32,4 36,28 32,32" fill="#2a78d6"/>
  <polygon points="32,4 28,28 32,32" fill="#1c5cab"/>
  <polygon points="60,32 36,36 32,32" fill="#2a78d6"/>
  <polygon points="60,32 36,28 32,32" fill="#1c5cab"/>
  <polygon points="32,60 28,36 32,32" fill="#2a78d6"/>
  <polygon points="32,60 36,36 32,32" fill="#1c5cab"/>
  <polygon points="4,32 28,28 32,32" fill="#2a78d6"/>
  <polygon points="4,32 28,36 32,32" fill="#1c5cab"/>
  <circle cx="32" cy="32" r="3.2" fill="#eb6834"/>
</svg>
